name: Tests

on:
  push:
    branches: [master, "development/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libglib2.0-0 libfontconfig1
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Compile application
        run: python -m compileall -q src main.py
      - name: Check new test and development code
        run: python -m ruff check tests/regressions tests/test_ui_smoke.py tests/conftest.py scripts src/core/session.py src/database/backup.py src/core/keyboard_layout.py src/core/lessons.py src/core/typing_engine.py src/core/analytics.py src/ui/pages/statistics.py
      - name: Run core and real Qt tests
        run: python -m pytest -ra --junitxml=test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ runner.os }}
          path: test-results.xml
          if-no-files-found: warn

  windows-package:
    needs: tests
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install pyinstaller==6.22.3
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-beta
          path: dist/
          if-no-files-found: error
