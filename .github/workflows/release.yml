name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install PySide6 PyInstaller

      - name: Generate icon
        run: python generate_icon.py

      - name: Build executable
        run: python -m PyInstaller TusKlavye.spec --clean --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TusKlavye-windows
          path: dist/TusKlavye.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y \
            libfuse2 desktop-file-utils \
            libegl1 libgl1 libglib2.0-0 libfontconfig1 \
            xvfb
          pip install PySide6 PyInstaller

      - name: Generate icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python generate_icon.py

      - name: Build AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build_linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TusKlavye-linux
          path: dist/TusKlavye-x86_64.AppImage

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: TusKlavye-windows
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: TusKlavye-linux
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/TusKlavye.exe
            dist/TusKlavye-x86_64.AppImage
