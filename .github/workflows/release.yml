name: Release

on:
  push:
    branches: [master]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    if: startsWith(github.ref, 'refs/tags/') || github.event.head_commit.message == 'TuşKlavye 2.0'
    env:
      QT_QPA_PLATFORM: offscreen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
      - name: Build and test Windows ZIP
        shell: pwsh
        run: |
          python scripts/build_release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = python -c "from src.config import APP_VERSION; print(APP_VERSION)"
          Compress-Archive -Path "dist/$version/TusKlavye.exe","dist/$version/SHA256SUMS.txt",LICENSE -DestinationPath "dist/TusKlavye-$version-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TusKlavye-windows
          path: dist/*-Windows.zip

  build-linux:
    if: startsWith(github.ref, 'refs/tags/') || github.event.head_commit.message == 'TuşKlavye 2.0'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y \
            libfuse2 desktop-file-utils \
            libegl1 libgl1 libglib2.0-0 libfontconfig1 \
            xvfb
          pip install PySide6 PyInstaller

      - name: Generate icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python generate_icon.py

      - name: Build AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash build_linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TusKlavye-linux
          path: dist/TusKlavye-x86_64.AppImage

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: TusKlavye-windows
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: TusKlavye-linux
          path: dist/

      - name: Tag stable release
        if: github.ref == 'refs/heads/master'
        run: |
          git tag v2.0 "$GITHUB_SHA"
          git push origin refs/tags/v2.0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0' }}
          target_commitish: ${{ github.sha }}
          body: Türkçe Q klavye için on parmak yazma eğitimi, süreli testler ve özel metin pratiği.
          fail_on_unmatched_files: true
          files: |
            dist/*-Windows.zip
            dist/TusKlavye-x86_64.AppImage
